name: Custom mailparse repro (PHP 8.3)

on:
  pull_request:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest

    env:
      MAILPARSE_REPO: https://github.com/php-mime-mail-parser/pecl-mail-mailparse.git
      MAILPARSE_REF: master # change ici vers ta branche patchée ensuite

    steps:
      - name: Checkout PMMP
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: phpize, php-config
          coverage: none

      - name: Install build dependency (re2c)
        run: |
          sudo apt-get update
          sudo apt-get install -y re2c

      - name: Show PHP environment
        run: |
          php -v
          php -i | grep -E "PHP API|Zend Extension Build|extension_dir"

      - name: Build mailparse from fork
        run: |
          git clone --depth=1 --branch "${MAILPARSE_REF}" "${MAILPARSE_REPO}" /tmp/mailparse
          cd /tmp/mailparse
          phpize
          ./configure --enable-mailparse
          make -j"$(nproc)"
          test -f modules/mailparse.so
          ls -l modules/mailparse.so

      - name: Install PMMP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify custom extension loads
        run: |
          php -n \
            -d extension=/tmp/mailparse/modules/mailparse.so \
            -m | grep -i mailparse

      - name: Run targeted reproducer test
        run: |
          php -n \
            -d extension=/tmp/mailparse/modules/mailparse.so \
            vendor/bin/phpunit tests/ExceptionTest.php --filter testMIMEMessageCannotBeParsedWithPath
