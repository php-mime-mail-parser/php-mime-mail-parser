name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  tests-uncompiled:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]
        dependency-version: [prefer-lowest, prefer-stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mailparse
          coverage: none

      - name: Detect official mailparse identity
        id: official_mailparse_info
        run: |
          php -r '
            $ext = new ReflectionExtension("mailparse");
            $version = $ext->getVersion();
            $file = method_exists($ext, "getFileName") ? $ext->getFileName() : "";
            $hash = ($file && is_file($file)) ? hash_file("sha256", $file) : "";

            echo "version=$version" >> getenv("GITHUB_OUTPUT");
            echo "file=$file" >> getenv("GITHUB_OUTPUT");
            echo "sha256=$hash" >> getenv("GITHUB_OUTPUT");
          '

      - name: Show PHP and official mailparse environment
        run: |
          php -v
          php --ini
          php -i | grep -E "PHP API|Zend Extension Build|extension_dir"
          php -m | grep -i mailparse
          php --ri mailparse || true
          echo "mailparse.version=${{ steps.official_mailparse_info.outputs.version }}"
          echo "mailparse.file=${{ steps.official_mailparse_info.outputs.file }}"
          echo "mailparse.sha256=${{ steps.official_mailparse_info.outputs.sha256 }}"

      - name: Install PMMP dependencies with custom extension
        run: |
          composer install --prefer-dist

      - name: Execute testIssue478file (official mailparse)
        id: official_issue478_file
        run: |
          set +e
          vendor/bin/phpunit --filter=testIssue478file
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Execute testIssue478 (official mailparse)
        id: official_issue478
        run: |
          set +e
          vendor/bin/phpunit --filter=testIssue478
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Execute testIssue478parser (official mailparse)
        id: official_issue478_parser
        run: |
          set +e
          vendor/bin/phpunit --filter=testIssue478parser
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize official mailparse results
        if: always()
        run: |
          echo "mailparse.version: ${{ steps.official_mailparse_info.outputs.version }}"
          echo "mailparse.file:    ${{ steps.official_mailparse_info.outputs.file }}"
          echo "mailparse.sha256:  ${{ steps.official_mailparse_info.outputs.sha256 }}"

          echo "testIssue478file exit code:   ${{ steps.official_issue478_file.outputs.exit_code }}"
          echo "testIssue478 exit code:       ${{ steps.official_issue478.outputs.exit_code }}"
          echo "testIssue478parser exit code: ${{ steps.official_issue478_parser.outputs.exit_code }}"

          segfault=0
          for c in "${{ steps.official_issue478_file.outputs.exit_code }}" "${{ steps.official_issue478.outputs.exit_code }}" "${{ steps.official_issue478_parser.outputs.exit_code }}"; do
            if [ "$c" = "139" ]; then
              segfault=1
            fi
          done

          if [ "$segfault" -eq 1 ]; then
            echo "Segfault reproduced with official mailparse (exit 139)."
            exit 1
          fi

          failed=0
          for c in "${{ steps.official_issue478_file.outputs.exit_code }}" "${{ steps.official_issue478.outputs.exit_code }}" "${{ steps.official_issue478_parser.outputs.exit_code }}"; do
            if [ "$c" != "0" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "No segfault, but at least one official-mailparse test failed functionally."
            exit 1
          fi


  tests:
    runs-on: ubuntu-latest

    env:
      MAILPARSE_REPO: https://github.com/php-mime-mail-parser/pecl-mail-mailparse.git
      MAILPARSE_REF: master
      COMPOSER_PROCESS_TIMEOUT: 0
      COMPOSER_NO_INTERACTION: 1
      COMPOSER_NO_AUDIT: 1

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]
        dependency-version: [prefer-lowest, prefer-stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none

      - name: Install build dependency (re2c)
        run: |
          sudo apt-get update
          sudo apt-get install -y re2c

      - name: Show PHP environment
        run: |
          php -v
          php --ini
          php -i | grep -E "PHP API|Zend Extension Build|extension_dir"


      - name: Build mailparse from fork
        run: |
          git clone --depth=1 --branch "${MAILPARSE_REF}" "${MAILPARSE_REPO}" /tmp/mailparse
          cd /tmp/mailparse
          phpize
          ./configure --enable-mailparse
          make -j"$(nproc)"
          test -f modules/mailparse.so
          ls -l modules/mailparse.so

      - name: Detect custom mailparse identity
        id: custom_mailparse_info
        run: |
          php -d extension=/tmp/mailparse/modules/mailparse.so -r '
            $ext = new ReflectionExtension("mailparse");
            $version = $ext->getVersion();
            $file = method_exists($ext, "getFileName") ? $ext->getFileName() : "";
            $hash = ($file && is_file($file)) ? hash_file("sha256", $file) : "";

            echo "version=$version" >> getenv("GITHUB_OUTPUT");
            echo "file=$file" >> getenv("GITHUB_OUTPUT");
            echo "sha256=$hash" >> getenv("GITHUB_OUTPUT");
          '

      - name: Verify custom mailparse loads
        run: |
          php -d extension=/tmp/mailparse/modules/mailparse.so -m | grep -i mailparse
          php -d extension=/tmp/mailparse/modules/mailparse.so --ri mailparse || true
          echo "mailparse.version=${{ steps.custom_mailparse_info.outputs.version }}"
          echo "mailparse.file=${{ steps.custom_mailparse_info.outputs.file }}"
          echo "mailparse.sha256=${{ steps.custom_mailparse_info.outputs.sha256 }}"

      - name: Install PMMP dependencies with custom extension
        run: |
          php -d extension=/tmp/mailparse/modules/mailparse.so "$(which composer)" install --prefer-dist

      - name: Execute testIssue478file (custom mailparse)
        id: custom_issue478_file
        run: |
          set +e
          php -d extension=/tmp/mailparse/modules/mailparse.so vendor/bin/phpunit --filter=testIssue478file
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Execute testIssue478 (custom mailparse)
        id: custom_issue478
        run: |
          set +e
          php -d extension=/tmp/mailparse/modules/mailparse.so vendor/bin/phpunit --filter=testIssue478
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Execute testIssue478parser (custom mailparse)
        id: custom_issue478_parser
        run: |
          set +e
          php -d extension=/tmp/mailparse/modules/mailparse.so vendor/bin/phpunit --filter=testIssue478parser
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize custom mailparse results
        if: always()
        run: |
          echo "mailparse.version: ${{ steps.custom_mailparse_info.outputs.version }}"
          echo "mailparse.file:    ${{ steps.custom_mailparse_info.outputs.file }}"
          echo "mailparse.sha256:  ${{ steps.custom_mailparse_info.outputs.sha256 }}"

          echo "testIssue478file exit code:   ${{ steps.custom_issue478_file.outputs.exit_code }}"
          echo "testIssue478 exit code:       ${{ steps.custom_issue478.outputs.exit_code }}"
          echo "testIssue478parser exit code: ${{ steps.custom_issue478_parser.outputs.exit_code }}"

          segfault=0
          for c in "${{ steps.custom_issue478_file.outputs.exit_code }}" "${{ steps.custom_issue478.outputs.exit_code }}" "${{ steps.custom_issue478_parser.outputs.exit_code }}"; do
            if [ "$c" = "139" ]; then
              segfault=1
            fi
          done

          if [ "$segfault" -eq 1 ]; then
            echo "Segfault reproduced with custom mailparse (exit 139)."
            exit 1
          fi

          failed=0
          for c in "${{ steps.custom_issue478_file.outputs.exit_code }}" "${{ steps.custom_issue478.outputs.exit_code }}" "${{ steps.custom_issue478_parser.outputs.exit_code }}"; do
            if [ "$c" != "0" ]; then
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "No segfault, but at least one custom-mailparse test failed functionally."
            exit 1
          fi
