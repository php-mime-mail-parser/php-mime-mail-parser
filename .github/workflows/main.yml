name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.2
            dependency-version: prefer-stable
            mailparse-version: 3.1.6
          - php: 8.3
            dependency-version: prefer-stable
            mailparse-version: 3.1.6
          - php: 8.4
            dependency-version: prefer-lowest
            mailparse-version: 3.1.8
          - php: 8.4
            dependency-version: prefer-stable
            mailparse-version: 3.1.8
          - php: 8.5
            dependency-version: prefer-lowest
            mailparse-version: 3.2.0
          - php: 8.5
            dependency-version: prefer-stable
            mailparse-version: 3.2.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mailparse-${{ matrix.mailparse-version }}
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      - name: Execute AttachmentTest
        run: vendor/bin/phpunit tests/AttachmentTest.php

      - name: Execute ParserTest
        run: vendor/bin/phpunit tests/ParserTest.php

      - name: Execute ExceptionTest testGetHeader
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testGetHeader

      - name: Execute ExceptionTest testGetHeaders
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testGetHeaders$

      - name: Execute ExceptionTest testGetHeadersRaw
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testGetHeadersRaw

      - name: Execute ExceptionTest testgetMessageBody
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testgetMessageBody

      - name: Execute ExceptionTest testgetInlineParts
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testgetInlineParts

      - name: Execute ExceptionTest testSetText
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testSetText

      - name: Execute ExceptionTest testSetStream
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testSetStream$

      - name: Execute ExceptionTest testSetStreamWithoutTmpPermissions
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testSetStreamWithoutTmpPermissions

      - name: Execute ExceptionTest testGetAttachmentStreamWithoutTmpPermissions
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testGetAttachmentStreamWithoutTmpPermissions

      - name: Execute ExceptionTest testSetStreamResource
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testSetStreamResource

      - name: Execute ExceptionTest testSaveAttachmentsWithoutPermissions
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testSaveAttachmentsWithoutPermissions

      - name: Execute ExceptionTest testSaveAttachmentsWithDuplicateNames
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testSaveAttachmentsWithDuplicateNames

      - name: Execute ExceptionTest testSaveAttachmentsInvalidStrategy
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testSaveAttachmentsInvalidStrategy

      - name: Execute ExceptionTest testMIMEMessageCannotBeParsed
        run: vendor/bin/phpunit tests/ExceptionTest.php --filter testMIMEMessageCannotBeParsed

  php-cs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none

      - name: Install dependencies
        run: composer update --no-progress --ignore-platform-reqs

      - name: Execute phpcs
        run: vendor/bin/phpcs src tests --standard=psr2

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: mailparse-3.2.0

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Execute code coverage
        run: |
          vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-filter src
          bash <(curl -s https://codecov.io/bash) -t ${{ secrets.COVERALLS_REPO_TOKEN }}
