name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.2
            dependency-version: prefer-stable
            mailparse-version: 3.1.6
          - php: 8.3
            dependency-version: prefer-stable
            mailparse-version: 3.1.6
          - php: 8.4
            dependency-version: prefer-lowest
            mailparse-version: 3.1.8
          - php: 8.4
            dependency-version: prefer-stable
            mailparse-version: 3.1.8
          - php: 8.5
            dependency-version: prefer-lowest
            mailparse-version: 3.2.0
          - php: 8.5
            dependency-version: prefer-stable
            mailparse-version: 3.2.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mailparse-${{ matrix.mailparse-version }}
          coverage: none

      - name: Check mailparse version
        run: php -i | grep -A 5 "mailparse"

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/phpunit

  php-cs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none

      - name: Install dependencies
        run: composer update --no-progress --ignore-platform-reqs

      - name: Execute phpcs
        run: vendor/bin/phpcs src tests --standard=psr2

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: mailparse-3.2.0

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Execute code coverage
        run: |
          vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-filter src
          bash <(curl -s https://codecov.io/bash) -t ${{ secrets.COVERALLS_REPO_TOKEN }}
