name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:

  tests:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow-failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.2
            dependency-version: prefer-stable
          - php: 8.2
            dependency-version: prefer-lowest
          - php: 8.3
            dependency-version: prefer-stable
            allow-failure: true
          - php: 8.4
            dependency-version: prefer-stable
            allow-failure: true
          - php: 8.5
            dependency-version: prefer-stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mailparse-3.2.0
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: |
          set +e
          output=$(php -d opcache.enable_cli=0 -d opcache.jit=0 vendor/bin/phpunit 2>&1)
          status=$?
          echo "$output"
          if echo "$output" | grep -qE '^OK \('; then
            exit 0
          fi
          exit $status

  php-cs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none

      - name: Install dependencies
        run: composer update --no-progress --ignore-platform-reqs

      - name: Execute phpcs
        run: vendor/bin/phpcs src tests --standard=psr2

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: mailparse-3.2.0

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Execute code coverage
        run: |
          set +e
          output=$(php -d opcache.enable_cli=0 -d opcache.jit=0 vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-filter src 2>&1)
          status=$?
          echo "$output"
          if ! echo "$output" | grep -qE '^OK \('; then
            exit $status
          fi
          bash <(curl -s https://codecov.io/bash) -t ${{ secrets.COVERALLS_REPO_TOKEN }}
